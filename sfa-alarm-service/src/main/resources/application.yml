server:
  port: 8083

spring:
  application:
    name: sfa-alarm-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/sfa_alarm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false"
    username: root
    password: ${DB_PASSWORD:root}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
        ip: 127.0.0.1
        prefer-ip-address: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sfa.alarm.entity
  configuration:
    map-underscore-to-camel-case: true
